name: Verify and build PikaTV
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Tests and release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Gradle wrapper is the published one
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install SDK
        run: bash build-support/install-sdk.sh 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify release tooling and the site
        run: |
          node --test build-support/*.test.mjs
          for script in build-support/*.sh; do bash -n "$script"; done
          shellcheck build-support/*.sh
          node build-support/build-pages.mjs build
      - name: Unit tests, lint and instrumentation APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 --no-watch-fs --console=plain
      - name: Build the release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --no-watch-fs --console=plain
          node build-support/release-tools.mjs check-apk app/build/outputs/apk/release
      - name: Scan the APKs with ClamAV
        run: bash build-support/clamav-scan.sh app/build/outputs/apk
      - name: Upload the unsigned APK for separate signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload device regression APKs (compiled, not executed here)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-regression-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
