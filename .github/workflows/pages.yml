name: Deploy project Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'build-support/build-pages.mjs', 'build-support/release-tools.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# Releases published or removed by hand redeploy through pages-on-release.yml;
# the release workflow calls this one itself.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Newest published release, pre-releases included
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p build/release
          gh api "repos/$GH_REPO/releases?per_page=30" > build/release/releases.json
      - run: node build-support/build-pages.mjs build build/release/releases.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
