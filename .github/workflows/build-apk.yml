name: Build and publish PikaTV
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true
      dry_run:
        description: Build, sign and scan only; publish nothing
        type: boolean
        default: true
      virustotal_max_malicious:
        description: VirusTotal detections to accept; raise only for a false positive checked by hand
        type: number
        default: 0
permissions:
  contents: read
concurrency:
  group: publish-pikatv
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Releases may only come from main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Version comes from the build file
        id: version
        run: |
          version="$(node build-support/release-tools.mjs version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version" >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: guard
    uses: ./.github/workflows/verify-build.yml
    permissions:
      contents: read
  sign:
    needs: [guard, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned-apk
          path: unsigned-apk
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install signing tools
        run: bash build-support/install-sdk.sh 'build-tools;36.0.0'
      - name: Restore private signing file
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pikatv-release.p12"
      - name: Sign and verify the persistent certificate
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/pikatv-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash build-support/sign-release.sh unsigned-apk dist
      - name: Delete temporary private key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/pikatv-release.p12"
      - name: Attest signed artifacts and checksums
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  scan:
    # Nothing is published unless both scanners pass the exact signed files.
    needs: [guard, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release
          path: dist
      - name: These are the signed release files
        run: node build-support/release-tools.mjs verify-assets dist
      - name: ClamAV
        run: |
          mkdir -p scan-report
          bash build-support/clamav-scan.sh dist scan-report/clamav.txt
      - name: VirusTotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VIRUSTOTAL_MAX_MALICIOUS: ${{ inputs.virustotal_max_malicious }}
        run: node build-support/virustotal-scan.mjs dist scan-report/virustotal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: scan-report
          path: scan-report/*
          if-no-files-found: warn
          retention-days: 90
  publish:
    needs: [guard, scan]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PIKATV_VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: scan-report
          path: scan-report
      - name: Verify integrity and publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          node build-support/release-tools.mjs verify-assets dist
          tag="v$PIKATV_VERSION"
          test -s release-notes/next.md
          test -s scan-report/virustotal.md
          {
            cat release-notes/next.md
            printf '\n## Проверка на вирусы\n\n'
            cat scan-report/virustotal.md
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo '::error::Release exists. Never overwrite published binaries.'
            exit 1
          fi
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "PikaTV $PIKATV_VERSION" --notes-file "$RUNNER_TEMP/notes.md" --draft "${args[@]}"
          gh release edit "$tag" --draft=false
  pages:
    # Releases made with GITHUB_TOKEN do not trigger other workflows, so the site is rebuilt here.
    needs: publish
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
