version: 2
updates:
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gradle
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    # Keep version-coupled families together; leave major migrations separate.
    groups:
      kotlin-toolchain:
        patterns: ['org.jetbrains.kotlin*']
        update-types: [minor, patch]
      media3:
        patterns: ['androidx.media3:*']
        update-types: [minor, patch]
      networking:
        patterns: ['com.squareup.okhttp3:*']
        update-types: [minor, patch]
      compose:
        patterns: ['androidx.compose*']
        update-types: [minor, patch]
