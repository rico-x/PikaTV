name: Ошибка
description: Ошибка приложения или управления пультом без приватных данных
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Не публикуйте пароли, cookies, токены, QR-коды входа и снимки личных разделов аккаунта.
  - type: input
    id: version
    attributes:
      label: Версия PikaTV
      placeholder: 0.4.3
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: ТВ или приставка и версия Android
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести, что ожидалось и что произошло
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Обезличенные логи или скриншоты (необязательно)
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед отправкой
      options:
        - label: В сообщении нет секретов и личных данных; похожие Issues проверены.
          required: true
